name: Build Naloia Glass (.dylib & .deb)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naloiaglass-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-contracts:
    name: Source, C Logic & ObjC Type Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Clang is installed
        run: |
          if ! command -v clang >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y clang
          fi
          clang --version
          python3 --version
      - name: Run full contract and native C/ObjC test suite
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

  build-ios-artifacts:
    name: Build iOS arm64 .dylib & Verify IPA Re-signing
    needs: verify-contracts
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Inspect Xcode and iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build @rpath/NaloiaGlass.dylib and IPA bundle
        shell: bash
        run: bash scripts/build_dylib.sh

      - name: Verify Mach-O dependencies and IPA re-signing resilience
        shell: bash
        run: |
          set -euo pipefail
          otool -L dist/NaloiaGlass.dylib
          python3 scripts/audit_macho.py dist/NaloiaGlass.dylib

          mkdir -p build/resign/WeChat.app/Frameworks build/resign/WeChat.app/Dylibs
          for rel in NaloiaGlass.dylib Frameworks/NaloiaGlass.dylib Dylibs/renamed-by-signer.dylib; do
            target="build/resign/WeChat.app/$rel"
            cp dist/NaloiaGlass.dylib "$target"
            codesign --remove-signature "$target"
            codesign --force --sign - --timestamp=none "$target"
            codesign --verify --strict --verbose=2 "$target"
            python3 scripts/audit_macho.py "$target"
          done

      - name: Package optional Rootless .deb
        shell: bash
        run: bash scripts/package_deb.sh

      - name: Show SHA-256 checksums
        shell: bash
        run: cat dist/SHA256SUMS.txt

      - name: Upload IPA Injection .dylib Bundle (Primary)
        uses: actions/upload-artifact@v4
        with:
          name: NaloiaGlass-ipa-dylib
          path: |
            dist/NaloiaGlass.dylib
            dist/NaloiaGlass-*-dylib.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload Rootless .deb Package (Optional)
        uses: actions/upload-artifact@v4
        with:
          name: NaloiaGlass-rootless-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 30
